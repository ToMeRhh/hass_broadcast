name: CI

on:
  push:
    branches: [master]
  pull_request:

# Five independent jobs, so a Python failure does not wait on the frontend
# pipeline and the check that failed names the half that broke.
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Vitest and esbuild strip types without checking them, so a type error
      # or an API newer than the target would otherwise sail through. tsconfig
      # sets lib ES2021: Array.prototype.at, for one, is ES2022 and must not
      # appear in frontend/ (see CLAUDE.md).
      - name: Type-check the card
        run: npx tsc --noEmit
      # Coverage is measured, not enforced: there is no floor until there is
      # a baseline to pick one from. Locally, `npm test` stays coverage-free.
      - run: npm test -- --coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node -e '
            const path = require("path");
            const s = require("./coverage/coverage-summary.json");
            const kinds = ["statements", "branches", "functions", "lines"];
            const cell = (m) => `${m.pct}% (${m.covered}/${m.total})`;
            const out = [
              "### Frontend coverage (`frontend/src/`)",
              "",
              "| Statements | Branches | Functions | Lines |",
              "| --- | --- | --- | --- |",
              "| " + kinds.map((k) => cell(s.total[k])).join(" | ") + " |",
              "",
              "<details><summary>Per file</summary>",
              "",
              "| File | Statements | Branches | Functions | Lines |",
              "| --- | --- | --- | --- | --- |",
            ];
            for (const [file, m] of Object.entries(s)) {
              if (file === "total") continue;
              const name = path.relative(process.cwd(), file);
              out.push("| `" + name + "` | " + kinds.map((k) => m[k].pct + "%").join(" | ") + " |");
            }
            out.push("", "</details>");
            console.log(out.join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # The card bundle is a committed build output -- installs get exactly
      # what is in the repo, there is no build step on the user's machine. A
      # source change without a rebuilt bundle ships nothing, and the symptom
      # (the old card, silently) looks nothing like the cause.
      - name: Rebuild the card bundle
        run: npm run build
      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --quiet -- custom_components/hass_broadcast/www/; then
            git diff --stat -- custom_components/hass_broadcast/www/
            echo "::error::The committed card bundle does not match frontend/src/. Run 'npm run build' and commit custom_components/hass_broadcast/www/."
            exit 1
          fi

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Home Assistant that requirements_test.txt pins sets the floor:
      # 2026.10 requires Python 3.14.2 or later. Bump the two together.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      # The coverage flags live here, not in pyproject.toml, so a local
      # `python -m pytest -q` stays as quick and as quiet as it was. Measured,
      # not enforced, like the frontend's.
      - run: >-
          python -m pytest -q
          --cov=custom_components/hass_broadcast --cov-branch
          --cov-report=term-missing
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          [ -f .coverage ] || exit 0
          {
            echo '### Python coverage (`custom_components/hass_broadcast/`)'
            echo
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

  # Lint and format only, so it installs ruff and not Home Assistant.
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_lint.txt
      - run: pip install -r requirements_lint.txt
      # GitHub output format annotates the offending lines on the PR.
      - run: ruff check --output-format=github .
      - run: ruff format --check --diff .

  # The card promises that nothing moves between idle, recording, review and
  # sending. vitest has no layout engine, so check:layout drives the dev
  # harness in headless Chromium and fails if any .slot changes its box. Its
  # own job, so the browser download does not hold up the tests above.
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run check:layout

      # The check screenshots every state it visits; on a failure they show
      # what moved.
      - name: Upload the layout screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: layout-screenshots
          path: /tmp/hass-broadcast-layout-*/
