name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test

      # Rebuild rather than trust the committed bundle: this is the last point
      # at which a forgotten `npm run build` can still be caught, and the
      # rebuilt output goes into the release commit either way.
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: python -m pytest -q

      # Bumping the version is not cosmetic. The card is registered as a
      # Lovelace resource at
      # /api/hass_broadcast/static/hass-broadcast-card.js?v=<manifest version>,
      # and that query string is the only thing that busts frontend caches. Ship
      # a new bundle under an unchanged version and every client -- the Android
      # companion app's WebView especially -- keeps serving the cached old one.
      - name: Bump the version in manifest.json
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import pathlib
          import re

          path = pathlib.Path("custom_components/hass_broadcast/manifest.json")
          source = path.read_text()
          # Rewrite just the matched span so the file's hand-maintained
          # formatting survives; a json round-trip would reflow every array.
          match = re.search(r'"version"\s*:\s*"(\d+)\.(\d+)\.(\d+)"', source)
          if match is None:
              raise SystemExit("no semver `version` field in manifest.json")

          major, minor, patch = (int(part) for part in match.groups())
          bump = os.environ["BUMP"]
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1

          version = f"{major}.{minor}.{patch}"
          path.write_text(f'{source[: match.start()]}"version": "{version}"{source[match.end() :]}')
          print(f"version={version}")
          PY

      - name: Commit, tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/hass_broadcast/manifest.json custom_components/hass_broadcast/www/
          git commit -m "chore: release v${VERSION}"
          # Annotated, and pushed explicitly: --follow-tags ignores lightweight
          # tags, so a `git tag` + `--follow-tags` pair silently pushes the
          # commit without the tag the release is then cut from.
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "refs/tags/v${VERSION}"
          gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
