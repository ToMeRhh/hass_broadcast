name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        type: choice
        options: [patch, minor, major]
        default: patch
      channel:
        description: stable for everyone, or beta for those who opted in in HACS
        type: choice
        options: [stable, beta]
        default: stable

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The card tests include a browser project, run in headless Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm test

      # Rebuild rather than trust the committed bundle: this is the last point
      # at which a forgotten `npm run build` can still be caught, and the
      # rebuilt output goes into the release commit either way.
      - run: npm run build

      # The Home Assistant that requirements_test.txt pins sets the floor:
      # 2026.10 requires Python 3.14.2 or later. Bump the two together.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: python -m pytest -q

      # Bumping the version is not cosmetic. The card is registered as a
      # Lovelace resource at
      # /api/hass_broadcast/static/hass-broadcast-card.js?v=<manifest version>,
      # and that query string is the only thing that busts frontend caches. Ship
      # a new bundle under an unchanged version and every client -- the Android
      # companion app's WebView especially -- keeps serving the cached old one.
      #
      # The next version comes from the tags, not from manifest.json, which
      # may hold a beta. `bump` always applies to the last stable release: the
      # betas of 0.9.0 are 0.9.0b1, 0.9.0b2, ..., and the release after them
      # is 0.9.0, so run each of them with the same `bump`. A beta is a GitHub
      # pre-release, which HACS offers only to those who ticked "Show beta
      # versions" for this repository; they are offered stable releases too,
      # since HACS picks the newest release of either kind.
      - name: Bump the version in manifest.json
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          python - $(git tag --list 'v*') <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import pathlib
          import re
          import sys

          tags = sys.argv[1:]
          stable = max(
              tuple(int(part) for part in match.groups())
              for tag in tags
              if (match := re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag))
          )
          betas: dict[tuple[int, ...], list[int]] = {}
          for tag in tags:
              if match := re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)b(\d+)", tag):
                  *base, number = (int(part) for part in match.groups())
                  if tuple(base) > stable:
                      betas.setdefault(tuple(base), []).append(number)

          major, minor, patch = stable
          bump = os.environ["BUMP"]
          if bump == "major":
              target = (major + 1, 0, 0)
          elif bump == "minor":
              target = (major, minor + 1, 0)
          else:
              target = (major, minor, patch + 1)

          # A beta of a later version is out, so this run would release
          # something older than it: almost certainly the wrong `bump`. A beta
          # of an earlier version is fine, and this run supersedes it.
          if betas and max(betas) > target:
              pending = ".".join(map(str, max(betas)))
              raise SystemExit(
                  f"betas of {pending} are out; run with the `bump` that produced them"
              )

          version = ".".join(map(str, target))
          prerelease = os.environ["CHANNEL"] == "beta"
          if prerelease:
              version += f"b{max(betas.get(target, [0])) + 1}"

          path = pathlib.Path("custom_components/hass_broadcast/manifest.json")
          source = path.read_text()
          # Rewrite just the matched span so the file's hand-maintained
          # formatting survives; a json round-trip would reflow every array.
          match = re.search(r'"version"\s*:\s*"\d+\.\d+\.\d+(?:b\d+)?"', source)
          if match is None:
              raise SystemExit("no `version` field in manifest.json")
          path.write_text(f'{source[: match.start()]}"version": "{version}"{source[match.end() :]}')

          print(f"version={version}")
          print(f"prerelease={str(prerelease).lower()}")
          print(f"previous=v{'.'.join(map(str, stable))}")
          PY

      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/hass_broadcast/manifest.json custom_components/hass_broadcast/www/
          git commit -m "chore: release v${VERSION}"
          # Annotated, and pushed explicitly: --follow-tags ignores lightweight
          # tags, so a `git tag` + `--follow-tags` pair silently pushes the
          # commit without the tag the release is then cut from.
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "refs/tags/v${VERSION}"

      # hacs.json sets zip_release, so HACS installs this asset rather than the
      # repository tree -- which is also what makes GitHub count downloads. HACS
      # extracts it into custom_components/<domain>/, so the integration's
      # files go at the zip root, not under a directory. Built after the commit
      # so it carries the bumped manifest, and without the __pycache__ that the
      # test run above left behind.
      - name: Build the HACS zip
        id: zip
        run: |
          domain=$(python -c 'import json; print(json.load(open("custom_components/hass_broadcast/manifest.json"))["domain"])')
          zip_path="${RUNNER_TEMP}/${domain}.zip"
          (cd "custom_components/${domain}" && zip -r "$zip_path" . -x '*__pycache__*' '*.pyc')
          unzip -l "$zip_path"
          echo "path=${zip_path}" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          PRERELEASE: ${{ steps.bump.outputs.prerelease }}
          PREVIOUS: ${{ steps.bump.outputs.previous }}
          ZIP: ${{ steps.zip.outputs.path }}
        run: |
          # Re-attach rather than fail if the release already exists, so a
          # rerun of this step still leaves the release with its zip.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$ZIP" --clobber
          else
            if [ "$PRERELEASE" = true ]; then
              channel=--prerelease
            else
              channel=--latest
            fi
            # Notes start at the last stable release, so a stable release
            # lists everything since the previous one, not just what changed
            # since its last beta.
            gh release create "v${VERSION}" "$ZIP" --title "v${VERSION}" \
              --generate-notes --notes-start-tag "$PREVIOUS" "$channel"
          fi
