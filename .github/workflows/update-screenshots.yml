name: Update screenshots

# Regenerates the visual tests' reference screenshots on a branch and
# commits them there, for a change to the card's look that is intended:
# Actions -> Update screenshots -> Run workflow, and pick the pull request's
# branch. They are made in the same container the `visual` CI job compares
# in, so nobody needs Docker to update them; the PR then shows exactly which
# pictures changed, for review like any other diff.
#
# A commit pushed with this workflow's token does not start CI by itself
# (GitHub's rule, against workflows triggering each other), so this run
# checks the new screenshots itself; re-run the PR's checks, or push again,
# to see them there.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Screenshot changes are reviewed in a pull request, not pushed.
      - name: Refuse the default branch
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::Run this on a pull request's branch, not ${GITHUB_REF_NAME}."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # From scratch, so the screenshots of a removed test go with it.
      - run: rm -rf frontend/test/visual/__screenshots__
      - run: npm run test:visual -- -u
      # The new references must pass the way the `visual` job runs them.
      - run: npm run test:visual

      - name: Commit the screenshots
        run: |
          git add -A frontend/test/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "No screenshot changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Screenshots updated"
            echo
            git diff --cached --name-status | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: update the visual screenshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
